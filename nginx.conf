  server {
    listen 80;
    server_name localhost;



    location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;
        }

          # sourcemaps (явно)
          location ~* \.map$ {
            default_type application/json;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
          }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
  }