stages: [build, deploy]

variables:
  IMAGE: "$CI_REGISTRY_IMAGE/wmunda-ui"
  TAG: "$CI_COMMIT_SHA"
  CONTAINER_NAME: "wmunda-ui"
  APP_PORT: 10003
build:
  stage: build
  tags: [dev-dg-prod-shell]
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    - docker build -t "$IMAGE:$TAG" .
    - docker push "$IMAGE:$TAG"

    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$IMAGE:$TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi

deploy:
  stage: deploy
  tags: [dev-dg-prod-shell]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
  variables:
    ENV_FILE: ${DOTENV_DEV}
    ASPNETCORE_ENVIRONMENT: Development
  script:
    - |

    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    - docker rm -f $CONTAINER_NAME
    - docker run --name $CONTAINER_NAME -d --restart=always -p127.0.0.1:${APP_PORT}:80 "$IMAGE:$TAG"
    - docker network connect bridge "$CONTAINER_NAME"
    - docker image prune -f
